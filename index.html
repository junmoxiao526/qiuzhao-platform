}

/* ========== PDF 上传处理 ========== */
function renderPdfStatus(data) {
  const section = document.getElementById('resumePdfSection');
  // 兼容旧格式：单对象 → 数组；非数组 → 空数组
  const rawPdf = data.resumePdf;
  const pdfs = Array.isArray(rawPdf) ? rawPdf : (rawPdf && typeof rawPdf === 'object' && rawPdf.fileName ? [rawPdf] : []);
  let html = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">'
    + '<div class="rps-title" style="margin-bottom:0;">📎 简历附件'+(pdfs.length?' <span style="font-weight:400;font-size:12px;color:#999;">('+pdfs.length+'份)</span>':'')+'</div>'
    + '<a class="btn btn-outline btn-sm" href="https://www.qmjianli.com/my/cv" target="_blank" style="text-decoration:none;white-space:nowrap;">🔗 跳转全民简历</a>'
    + '</div>';

  // always show upload zone (compact when files exist)
  html += '<div style="margin-bottom:10px;">'
    + '<div class="pdf-upload-zone" id="pdfUploadZone" style="padding:' + (pdfs.length ? '12px 14px' : '18px 14px') + ';">'
    + '<div class="puz-icon" style="font-size:' + (pdfs.length ? '22px' : '28px') + ';margin-bottom:' + (pdfs.length ? '2px' : '4px') + ';">📂</div>'
    + '<div class="puz-text">拖拽 <b>.pdf</b> 到此处或 <b>点击添加</b>'+(pdfs.length?'（可上传多份）':'')+'</div>'
    + '<input type="file" id="pdfFileInput" accept=".pdf" onchange="handlePdfUpload(this.files)" style="display:none;">'
    + '</div></div>';

  // list existing PDFs
  pdfs.forEach(function(pdf, i) {
    const sizeKB = Math.round((pdf.base64||'').length * 0.75 / 1024);
    const uploadedAt = pdf.uploadedAt ? new Date(pdf.uploadedAt).toLocaleString('zh-CN') : '';
    html += '<div class="pdf-file-card" style="margin-bottom:8px;">'
      + '<div class="pfc-icon">📄</div>'
      + '<div class="pfc-info">'
      + '<div class="pfc-name">'+escapeHtml(pdf.fileName||'resume.pdf')+'</div>'
      + '<div class="pfc-meta">'+sizeKB+' KB'+(uploadedAt?' · '+uploadedAt:'')+'</div>'
      + '</div>'
      + '<div class="pfc-actions">'
      + '<button class="pfc-btn" onclick="previewPdf('+i+')">🔍 预览</button>'
      + '<button class="pfc-btn" onclick="downloadPdf('+i+')">⬇ 下载</button>'
      + '<button class="pfc-btn" onclick="renamePdf('+i+')">✏️ 重命名</button>'
      + '<button class="pfc-btn" onclick="replacePdf('+i+')">🔄 替换</button>'
      + '<button class="pfc-btn del" onclick="removePdf('+i+')">✕ 删除</button>'
      + '</div>'
      + '</div>';
  });

  section.innerHTML = html;

  // bind upload zone events
  const zone = document.getElementById('pdfUploadZone');
  if (zone) {
    zone.onclick = function(){ document.getElementById('pdfFileInput').click(); };
    zone.ondragover = function(e){ e.preventDefault(); zone.classList.add('dragover'); };
    zone.ondragleave = function(){ zone.classList.remove('dragover'); };
    zone.ondrop = function(e){ e.preventDefault(); zone.classList.remove('dragover'); handlePdfUpload(e.dataTransfer.files); };
  }
}

function handlePdfUpload(files) {
  if (!files || !files.length) return;
  const file = files[0];
  if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
    toast('请上传 .pdf 格式的文件'); return;
  }
  if (file.size > 10 * 1024 * 1024) {
    toast('PDF 文件不能超过 10MB'); return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    const data = loadResumeData();
    if (!Array.isArray(data.resumePdf)) data.resumePdf = [];
    data.resumePdf.push({
      fileName: file.name,
      base64: e.target.result,
      uploadedAt: new Date().toISOString()
    });
    saveResumeData(data);
    renderPdfStatus(data);
    toast('PDF 简历已添加（共'+data.resumePdf.length+'份）');
  };
  reader.readAsDataURL(file);
}


function removePdf(idx) {
  const data = loadResumeData();
  if (!data.resumePdf || idx < 0 || idx >= data.resumePdf.length) return;
  const name = data.resumePdf[idx].fileName || 'resume.pdf';
  data.resumePdf.splice(idx, 1);
  saveResumeData(data);
  renderPdfStatus(data);
  toast('已删除「'+name+'」（剩余'+data.resumePdf.length+'份）');
}

function renamePdf(idx) {
  const data = loadResumeData();
  const rawPdf2 = data.resumePdf;
  const pdfs = Array.isArray(rawPdf2) ? rawPdf2 : (rawPdf2 && typeof rawPdf2 === 'object' && rawPdf2.fileName ? [rawPdf2] : []);
  if (idx < 0 || idx >= pdfs.length) return;
  const oldName = pdfs[idx].fileName || 'resume.pdf';
  const newName = prompt('请输入新的文件名（保留 .pdf 后缀）：', oldName);
  if (!newName || newName === oldName) return;
  const safeName = newName.trim();
  if (!safeName) return;
  const finalName = safeName.endsWith('.pdf') ? safeName : safeName + '.pdf';
  const renamed = {
    fileName: finalName,
    base64: pdfs[idx].base64,
    uploadedAt: pdfs[idx].uploadedAt || new Date().toISOString()
  };
  // 旧单对象格式 → 转为数组，避免旧 fileName 残留
  if (Array.isArray(data.resumePdf)) {
    data.resumePdf[idx] = renamed;
  } else {
    data.resumePdf = [renamed];
  }
  saveResumeData(data);
  renderPdfStatus(data);
  toast('已重命名为「'+finalName+'」');
}

function previewPdf(idx) {
  const data = loadResumeData();
  const rawPdf2 = data.resumePdf;
  const pdfs = Array.isArray(rawPdf2) ? rawPdf2 : (rawPdf2 && typeof rawPdf2 === 'object' && rawPdf2.fileName ? [rawPdf2] : []);
  if (idx < 0 || idx >= pdfs.length || !pdfs[idx].base64) return;
  const container = document.getElementById('pdfPreviewContainer');
  const iframe = document.getElementById('pdfPreviewIframe');
  const label = document.getElementById('pdfPreviewLabel');
  iframe.src = pdfs[idx].base64;
  label.textContent = '📄 正在预览：' + (pdfs[idx].fileName || 'resume.pdf');
  container.style.display = 'flex';
}

function closePdfPreview() {
  document.getElementById('pdfPreviewContainer').style.display = 'none';
  document.getElementById('pdfPreviewIframe').src = '';
}

function replacePdf(idx) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.pdf';
  input.onchange = function() {
    const file = input.files[0];
    if (!file) return;
    if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
      toast('请上传 .pdf 格式的文件'); return;
    }
    if (file.size > 10 * 1024 * 1024) {
      toast('PDF 文件不能超过 10MB'); return;
    }
    const reader = new FileReader();
    reader.onload = function(e) {
      const data = loadResumeData();
      data.resumePdf[idx] = {
        fileName: file.name,
        base64: e.target.result,
        uploadedAt: new Date().toISOString()
      };
      saveResumeData(data);
      renderPdfStatus(data);
      toast('PDF 已替换');
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function downloadPdf(idx) {
  const data = loadResumeData();
  const rawPdf2 = data.resumePdf;
  const pdfs = Array.isArray(rawPdf2) ? rawPdf2 : (rawPdf2 && typeof rawPdf2 === 'object' && rawPdf2.fileName ? [rawPdf2] : []);
  if (idx < 0 || idx >= pdfs.length || !pdfs[idx].base64) return;
  const pdf = pdfs[idx];
  const a = document.createElement('a');
  a.href = pdf.base64;
  a.download = pdf.fileName || 'resume.pdf';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

</script>
</body>
</html>
